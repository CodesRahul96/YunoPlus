name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - name: Assemble debug and release
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --console=plain || {
            SDK_DIR="${ANDROID_HOME:-$HOME/Android/Sdk}"
            if [ -d "$SDK_DIR/platforms/android-37.0" ] && [ ! -d "$SDK_DIR/platforms/android-37" ]; then
              cp -r "$SDK_DIR/platforms/android-37.0" "$SDK_DIR/platforms/android-37"
              sed -i 's/AndroidVersion.ApiLevel=37.0/AndroidVersion.ApiLevel=37/' "$SDK_DIR/platforms/android-37/source.properties"
            fi
            ./gradlew assembleDebug --console=plain
          }
          ./gradlew assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: YunoPlus-apks
          path: app/build/outputs/apk/**/*.apk
